name: Create and Push Base Image to DigitalOcean Container Registry

on:
  push:
    branches:
      - main
    tags:
      - 'base-*'
jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/base-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@main
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Build container image
        run: docker build -t ${{ vars.REGISTRY_NAME }}/${{github.event.repository.name}}:base -f Dockerfile_base .
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200
      - name: Push image to DigitalOcean Container Registry
        run: docker push ${{ vars.REGISTRY_NAME }}/${{github.event.repository.name}}:base
name: Deployment

on:
  push:
    branches: [ main ]
    tags-ignore:
      - "base-*"
#on:
#  workflow_run:
#    workflows: ["Tests"]
#    types:
#      - completed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@main
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200
      - name: Build container image
        run: docker build -t ${{ vars.REGISTRY_NAME }}/${{github.event.repository.name}}:latest -t ${{ vars.REGISTRY_NAME }}/${{github.event.repository.name}}:${{github.run_number}} .
      - name: Push image to DigitalOcean Container Registry
        run: docker push --all-tags ${{ vars.REGISTRY_NAME }}/${{github.event.repository.name}}

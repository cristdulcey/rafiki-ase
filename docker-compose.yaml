services:
  ase:
    image: registry.digitalocean.com/loducode/ase:12
    platform: linux/amd64
    build:
        context: .
        dockerfile: ./Dockerfile
    command: sh -c "echo base | figlet && uvicorn main:app --reload --host 0.0.0.0 --port 9001"
#    env_file:
#      - .envs/.env
#    volumes:
#      - ./src/:/code
    ports:
      - 9001:9001

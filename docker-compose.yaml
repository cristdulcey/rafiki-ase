services:
  ase:
    image: registry.digitalocean.com/loducode/ase:1.0.1
    platform: linux/amd64
    build:
        context: .
        dockerfile: ./Dockerfile
    command: uvicorn main:app --reload --host 0.0.0.0 --port 10000
#    env_file:
#      - .envs/.env
    volumes:
      - ./src/:/code
    ports:
      - "10000:10000"
